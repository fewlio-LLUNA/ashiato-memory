# main への push で検査 → ビルド → GitHub Pages へデプロイする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # React 内部の XML 名前空間 URI とエラー文中のリンク文字列は通信を伴わないため除外する
      - name: 外部URL参照がないことを確認
        run: |
          if grep -rnoE "https?://[^\"' )]+" dist | grep -vE "http://www\.w3\.org/|https://reactjs\.org/docs/error-decoder"; then
            echo "dist に外部URLへの参照があります" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
